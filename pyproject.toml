[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cinowallet-recsys_jd464"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出推荐系统算法工程师·查询改写的语义漂移上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cinowallet" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cinowallet.github.io"
Repository = "https://github.com/cinowallet/recsys_jd464"
Issues = "https://github.com/cinowallet/recsys_jd464/issues"

[project.scripts]
recsys_jd464 = "recsys_jd464:main"

[tool.setuptools]
py-modules = ["recsys_jd464"]
